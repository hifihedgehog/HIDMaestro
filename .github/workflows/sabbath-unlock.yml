name: Sabbath unlock

# Releases the interaction limit at 00:01 America/New_York every Monday.
# GitHub Actions cron is evaluated in UTC; the schedule string below is the
# literal user-specified expression with timezone intent recorded via the TZ
# env var. Manual fire is available via workflow_dispatch.
on:
  schedule:
    - cron: '1 0 * * 1'
  workflow_dispatch:

permissions: {}

env:
  TZ: America/New_York

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Unlock interactions
        env:
          SABBATH_PAT: ${{ secrets.SABBATH_PAT }}
        run: |
          if [ -z "$SABBATH_PAT" ]; then
            echo "::error::SABBATH_PAT secret is not set"
            exit 1
          fi
          curl --fail-with-body -sS -X DELETE \
            -H "Authorization: Bearer $SABBATH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/interaction-limits"
