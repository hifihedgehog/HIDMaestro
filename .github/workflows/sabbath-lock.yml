name: Sabbath lock

# Locks the repo to collaborators_only for one day at 23:59 America/New_York
# every Saturday. GitHub Actions cron is evaluated in UTC; the schedule string
# below is the literal user-specified expression with timezone intent recorded
# via the TZ env var. Manual fire is available via workflow_dispatch.
on:
  schedule:
    - cron: '59 23 * * 6'
  workflow_dispatch:

permissions: {}

env:
  TZ: America/New_York

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Lock interactions (collaborators_only, one_day)
        env:
          SABBATH_PAT: ${{ secrets.SABBATH_PAT }}
        run: |
          if [ -z "$SABBATH_PAT" ]; then
            echo "::error::SABBATH_PAT secret is not set"
            exit 1
          fi
          curl --fail-with-body -sS -X PUT \
            -H "Authorization: Bearer $SABBATH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"limit":"collaborators_only","expiry":"one_day"}' \
            "https://api.github.com/repos/${{ github.repository }}/interaction-limits"
